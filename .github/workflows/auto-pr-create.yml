name: Request-tag PR Creator

on:
  push:
    tags:
      - 'pr-create/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-broker-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted Broker revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail

          request="${GITHUB_REF_NAME#pr-create/}"
          head_sha="${request%%/*}"
          head_branch="${request#*/}"

          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Request tag must contain a full 40-character lowercase commit SHA" >&2
            exit 1
          fi
          if [[ ! "$head_branch" =~ ^codex/[A-Za-z0-9._/-]+$ ]]; then
            echo "Only codex/* work branches are accepted" >&2
            exit 1
          fi
          git check-ref-format "refs/heads/$head_branch"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$head_branch:refs/remotes/origin/$head_branch"

          broker_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          remote_head="$(git rev-parse "refs/remotes/origin/$head_branch")"

          if [[ "$broker_sha" != "$main_sha" ]]; then
            echo "Request tag does not point to the current trusted main Broker revision" >&2
            exit 1
          fi
          if [[ "$remote_head" != "$head_sha" ]]; then
            echo "Requested SHA is not the current remote work-branch HEAD" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$main_sha" "$head_sha"

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_branch=$head_branch" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "broker_sha=$broker_sha" >> "$GITHUB_OUTPUT"

      - name: Run repository gate from trusted Broker revision
        env:
          BROKER_SHA: ${{ steps.request.outputs.broker_sha }}
          HEAD_BRANCH: ${{ steps.request.outputs.head_branch }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git show "$BROKER_SHA:.github/pr-broker-gate.sh" > "$RUNNER_TEMP/pr-broker-gate.sh"
          git checkout -B "$HEAD_BRANCH" "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          bash "$RUNNER_TEMP/pr-broker-gate.sh"

      - name: Revalidate base and branch immediately before PR
        env:
          EXPECTED_MAIN: ${{ steps.request.outputs.main_sha }}
          HEAD_BRANCH: ${{ steps.request.outputs.head_branch }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          remote_head="$(git rev-parse "refs/remotes/origin/$HEAD_BRANCH")"
          test "$remote_head" = "$HEAD_SHA"

      - name: Validate exact-head PR explanation
        env:
          BROKER_SHA: ${{ steps.request.outputs.broker_sha }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git show "$BROKER_SHA:.github/pr-broker-body.mjs" > "$RUNNER_TEMP/pr-broker-body.mjs"
          git show "$HEAD_SHA:.github/PR_REQUEST.md" > "$RUNNER_TEMP/pr-body.md"
          node "$RUNNER_TEMP/pr-broker-body.mjs" "$RUNNER_TEMP/pr-body.md"

      - name: Create or reuse pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.request.outputs.head_branch }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_url="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$HEAD_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url')"

          if [[ -z "$pr_url" ]]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$HEAD_BRANCH" \
              --title "Review $HEAD_BRANCH" \
              --body-file "$RUNNER_TEMP/pr-body.md")"
          else
            current_pr_head="$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid')"
            if [[ "$current_pr_head" != "$HEAD_SHA" ]]; then
              echo "Existing PR head changed before its body could be updated" >&2
              exit 1
            fi
            gh pr edit "$pr_url" --body-file "$RUNNER_TEMP/pr-body.md"
          fi

          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Verify open pull request for exact head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          EXPECTED_MAIN: ${{ steps.request.outputs.main_sha }}
          HEAD_BRANCH: ${{ steps.request.outputs.head_branch }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
          state="$(gh pr view "$PR_URL" --json state --jq '.state')"
          head="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"
          base="$(gh pr view "$PR_URL" --json baseRefName --jq '.baseRefName')"
          if [[ "$state" != "OPEN" || "$head" != "$HEAD_SHA" || "$base" != "main" || \
                "$(git rev-parse refs/remotes/origin/main)" != "$EXPECTED_MAIN" || \
                "$(git rev-parse "refs/remotes/origin/$HEAD_BRANCH")" != "$HEAD_SHA" ]]; then
            echo "PR or Git refs changed; an opened PR may remain and must be inspected before retry" >&2
            exit 1
          fi

      - name: Remove completed request tag
        shell: bash
        run: git push origin ":refs/tags/$GITHUB_REF_NAME"
